plugins { id 'com.android.application' }
android {
    namespace 'pe.edu.bosquealerta'
    compileSdk 36
    defaultConfig { applicationId 'pe.edu.bosquealerta'; minSdk 28; targetSdk 35; versionCode 8; versionName '2.1' }
    defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress += 'tflite' }
}
tasks.matching { it.name == 'preBuild' }.configureEach {
    doFirst {
        if (!file('src/main/assets/bosque_alerta.tflite').exists()) {
            throw new GradleException('Modelo ausente. Ejecutar entrenamiento/entrenar.py antes de compilar.')
        }
        if (!file('src/main/assets/contrato.json').exists()) {
            throw new GradleException('Contrato v2 ausente. Ejecutar herramientas/activar_modelo_v2.py antes de compilar.')
        }
    }
}
dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    implementation 'com.google.ai.edge.litert:litert:1.4.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
}
