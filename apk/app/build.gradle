plugins { id 'com.android.application' }
android {
    namespace 'pe.edu.bosquealerta'
    compileSdk 36
    defaultConfig { applicationId 'pe.edu.bosquealerta'; minSdk 28; targetSdk 35; versionCode 5; versionName '1.4' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress += 'tflite' }
}
tasks.matching { it.name == 'preBuild' }.configureEach {
    doFirst {
        if (!file('src/main/assets/bosque_alerta.tflite').exists()) {
            throw new GradleException('Modelo ausente. Ejecutar entrenamiento/entrenar.py antes de compilar.')
        }
    }
}
dependencies {
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
}
